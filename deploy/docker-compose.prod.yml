services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8010"
    environment:
      CORPUS_GOLD_DIR: ${CORPUS_GOLD_DIR:-/data/carvajal/data/gold}
      CATALOG_DIR: ${CATALOG_DIR:-/data/carvajal/data/catalog/empaques}
      CATALOG_ROUTING_FILE: ${CATALOG_ROUTING_FILE:-/data/carvajal/data/eval/routing_questions.json}
      QDRANT_PATH: /app/.cache/qdrant
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      FEEDBACK_LOG_PATH: /app/.cache/feedback.jsonl
      QUOTES_LOG_PATH: /app/.cache/solicitudes.jsonl
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - ../../carvajal/data:/data/carvajal:ro
      - app-cache:/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/readyz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  app-cache:
  caddy-data:
  caddy-config:
  ollama-models:
