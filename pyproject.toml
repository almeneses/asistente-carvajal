[project]
name = "asistente-carvajal"
version = "0.1.0"
description = "Asistente conversacional con RAG sobre el corpus web y la documentación de empaques de Carvajal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = []
authors = [
    { name = "almeneses", email = "almenesesp@gmail.com" },
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
    "qdrant-client>=1.20.0",
    "uvicorn>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/almeneses/asistente-carvajal"
Repository = "https://github.com/almeneses/asistente-carvajal"
Issues = "https://github.com/almeneses/asistente-carvajal/issues"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.6",
    "ty>=0.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["assistant", "tests", "scripts"]
extend-exclude = [".specify"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
exclude = [".specify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
