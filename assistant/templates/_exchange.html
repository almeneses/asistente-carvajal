{% if error %}
<article class="exchange" data-status="error" data-request-id="{{ request_id }}">
  <div class="msg user"><div class="bubble"><p>{{ question }}</p></div></div>
  <div class="msg carva">
    <div class="avatar" aria-hidden="true">Carva</div>
    <div class="bubble">
      <div class="answer-text"><p>{{ error }}</p></div>
      <p class="hint">Referencia: {{ request_id }}</p>
    </div>
  </div>
</article>
{% else %}
<article class="exchange" data-status="{{ answer.status }}" data-request-id="{{ answer.request_id }}"
         data-provider="{{ answer.provider or '' }}">
  <div class="msg user"><div class="bubble"><p>{{ question }}</p></div></div>
  <div class="msg carva">
    <div class="avatar" aria-hidden="true">Carva</div>
    <div class="bubble">
      <div class="answer-text">{{ answer.text | markdown | safe }}</div>
      {% if answer.sources %}
      {% with sources = answer.sources %}{% include "_sources.html" %}{% endwith %}
      {% endif %}
    </div>
  </div>
</article>
{% endif %}
