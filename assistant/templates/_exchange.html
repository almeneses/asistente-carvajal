{% if error %}
<section class="exchange" data-status="error" data-request-id="{{ request_id }}">
  <p class="question">{{ question }}</p>
  <div class="answer">{{ error }}</div>
  <p class="request-id">Referencia: {{ request_id }}</p>
</section>
{% else %}
<section class="exchange" data-status="{{ answer.status }}"
         {% if answer.provider %}data-provider="{{ answer.provider }}"{% endif %}
         data-request-id="{{ answer.request_id }}">
  <p class="question">{{ question }}</p>
  <div class="answer">{{ answer.text }}</div>
  {% if answer.sources %}
  <ul class="sources">
    {% for source in answer.sources %}
    <li>
      <a href="{{ source.url }}" target="_blank" rel="noopener noreferrer">{{ source.title }}</a>
      <span class="source-type">{{ source.source_type }}</span>
    </li>
    {% endfor %}
  </ul>
  {% endif %}
</section>
{% endif %}
