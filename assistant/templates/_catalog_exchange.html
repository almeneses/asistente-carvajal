{% set section = answer.section %}
<article class="exchange catalog-exchange" data-intent="{{ answer.intent }}"
         {% if section %}data-status="{{ section.kind }}"{% endif %}>
  <div class="msg user"><div class="bubble"><p>{{ question }}</p></div></div>
  <div class="msg carva">
    <div class="avatar" aria-hidden="true">Carva</div>
    <div class="bubble">
      {% with warnings = answer.warnings %}{% include "_catalog_section.html" %}{% endwith %}
    </div>
  </div>
</article>
